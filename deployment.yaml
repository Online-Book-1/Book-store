apiVersion: apps/v1
kind: Deployment
metadata:
  name: book-store-app-auth-deployment
spec:
  selector:
    matchLabels:
      app: book-store-app-auth
  template:
    metadata:
      labels:
        app: book-store-app-auth
    spec:
      containers:
      - name: book-store-app-auth-container
        image: hritik2345/book-store-app-auth:latest
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"  # ← increase from 128Mi to 512Mi
            cpu: "500m"
        ports:
        - containerPort: 8000
        envFrom:
        - secretRef:
            name: book-store-app-auth-secret
          
